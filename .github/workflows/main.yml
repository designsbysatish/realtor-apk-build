name: Build Android APK Final
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract and Deep Find Project
        run: |
          sudo apt-get install unzip -y
          unzip *.zip -d extracted_project
          
          # यह कमांड पूरे फोल्डर में जहां भी gradlew फाइल होगी उसे ढूंढकर मुख्य जगह ले आएगा
          GRADLEW_PATH=$(find extracted_project -name "gradlew" -print -quit)
          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "Project found at: $PROJECT_ROOT"
          
          # सभी फाइलों को मुख्य डायरेक्टरी में ट्रांसफर करें
          cp -r $PROJECT_ROOT/. .
          rm -rf extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            
            
