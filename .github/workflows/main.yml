name: Build Android Master APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          sudo apt-get install unzip -y
          unzip -o *.zip -d .
          rm -f *.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Generate Missing Gradle Wrapper
        run: |
          # अगर gradlew फाइल नहीं है, तो यह खुद नया ग्रैडल सेटअप तैयार कर देगा
          PROJECT_DIR=$(find . -name "build.gradle.kts" -o -name "build.gradle" -print -quit | xargs dirname)
          cd $PROJECT_DIR
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(find . -name "build.gradle.kts" -o -name "build.gradle" -print -quit | xargs dirname)
          cd $PROJECT_DIR
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            
