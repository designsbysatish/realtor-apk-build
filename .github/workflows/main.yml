name: Build Android APK Final Fix
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Smartly
        run: |
          sudo apt-get install unzip -y
          unzip -o *.zip -d .
          rm -f *.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          else
            find . -name "gradlew" -exec chmod +x {} \;
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
            PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
            cd $PROJECT_ROOT
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            
